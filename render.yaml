services:
  - type: web
    name: northline-assist
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
